<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Calendar body -->
  <rect x="8" y="14" width="48" height="46" rx="6" fill="#e85d26"/>
  <!-- Calendar header -->
  <rect x="8" y="14" width="48" height="12" rx="6" fill="#1e3a5f"/>
  <rect x="8" y="20" width="48" height="6" fill="#1e3a5f"/>
  <!-- Calendar rings (top hanging) -->
  <rect x="16" y="10" width="6" height="8" rx="3" fill="#1e3a5f"/>
  <rect x="42" y="10" width="6" height="8" rx="3" fill="#1e3a5f"/>
  <!-- Calendar grid lines -->
  <line x1="20" y1="34" x2="44" y2="34" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <line x1="20" y1="40" x2="44" y2="40" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <line x1="20" y1="46" x2="44" y2="46" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <line x1="20" y1="52" x2="44" y2="52" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <!-- North star above -->
  <polygon points="32,2 34,6 38,6 35,9 36,13 32,10 28,13 29,9 26,6 30,6" fill="#e85d26"/>
</svg>